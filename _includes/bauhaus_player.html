<div class="bauhaus-floating-player" id="bauhaus-player" aria-label="Floating music player">
    <div class="bauhaus-player-strip" aria-hidden="true"></div>
    <button type="button" class="bauhaus-player-toggle" id="bauhaus-player-toggle" aria-expanded="true" aria-label="Toggle player">
        <span class="bauhaus-toggle-track"><span class="bauhaus-toggle-thumb"></span></span>
        <span class="bauhaus-toggle-label">PLAYER</span>
    </button>
    <div class="bauhaus-player-title-row">
        <div class="bauhaus-track-copy">
            <span class="bauhaus-track-title" id="bauhaus-track-title">Suite Bergamasque, L. 75, CD 82 III. Clair de Lune</span>
            <span class="bauhaus-track-author" id="bauhaus-track-author">Jean-Efflam Bavouzet</span>
        </div>
        <button type="button" class="bauhaus-list-toggle" id="bauhaus-list-toggle" aria-expanded="false" aria-controls="bauhaus-track-list">LIST</button>
    </div>
    <div class="bauhaus-track-list" id="bauhaus-track-list" hidden></div>
    <div class="bauhaus-player-controls">
        <button type="button" class="bauhaus-player-button square" id="bauhaus-prev" aria-label="Previous track"><img src="{{ '/assets/images/left.png' | relative_url }}" alt=""></button>
        <button type="button" class="bauhaus-player-button play bauhaus-player-button2" id="bauhaus-play" aria-label="Play or pause" data-play-icon="{{ '/assets/images/stop.png' | relative_url }}" data-stop-icon="{{ '/assets/images/play.png' | relative_url }}"><img src="{{ '/assets/images/play.png' | relative_url }}" alt="" ></button>
        <button type="button" class="bauhaus-player-button square" id="bauhaus-next" aria-label="Next track"><img src="{{ '/assets/images/right.png' | relative_url }}" alt=""></button>
        <div class="bauhaus-progress-wrap">
            <input type="range" id="bauhaus-progress" min="0" max="100" value="0" aria-label="Track progress">
            <div class="bauhaus-player-time" id="bauhaus-time">0:00</div>
        </div>
    </div>
    <audio id="homepage-audio" autoplay muted preload="auto" playsinline src="{{ '/assets/audio/%5BJean-Efflam%20Bavouzet%5D%20-%20Suite%20Bergamasque%2C%20L.%2075%2C%20CD%2082%20III.%20Clair%20de%20Lune.mp3' | relative_url }}"></audio>
</div>
